<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的百科</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #f8f9fa; color: #202122; display: flex; height: 100vh; overflow: hidden; }
    .hidden { display: none !important; }

    /* 登入畫面 (維持不變) */
    .auth-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f8f9fa; z-index: 1000; }
    .auth-card { background: #fff; border: 1px solid #a2a9b1; border-radius: 4px; padding: 32px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
    .auth-card h1 { text-align: center; font-size: 1.8rem; font-family: "Times New Roman", serif; border-bottom: 1px solid #a2a9b1; padding-bottom: 10px; }
    .auth-card input { padding: 10px; border: 1px solid #a2a9b1; border-radius: 2px; font-size: 1rem; }
    .auth-card button { padding: 10px; background: #3366cc; color: #fff; border: none; border-radius: 2px; cursor: pointer; font-size: 1rem; }
    .auth-card button.ghost { background: #fff; color: #3366cc; border: 1px solid #3366cc; }
    .auth-card .msg { text-align: center; font-size: .85rem; color: #d33; min-height: 1em; }

    /* 側邊欄 (目錄) */
    .sidebar { width: 250px; background: #fff; border-right: 1px solid #a2a9b1; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #a2a9b1; background: #f8f9fa; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 1.2rem; font-family: "Times New Roman", serif; }
    .sidebar-search { padding: 10px; border-bottom: 1px solid #eaecf0; }
    .sidebar-search input { width: 100%; padding: 8px; border: 1px solid #a2a9b1; border-radius: 2px; }
    .nav-list { flex: 1; overflow-y: auto; padding: 10px; }
    .nav-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eaecf0; font-size: 0.95rem; color: #3366cc; }
    .nav-item:hover { background: #eaecf0; text-decoration: underline; }
    
    /* 主內容區 (文章閱讀) */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #fff; padding: 20px 40px; }
    .article { max-width: 800px; margin: 0 auto; width: 100%; }
    .article h1 { font-family: "Times New Roman", serif; font-size: 2.2rem; font-weight: normal; border-bottom: 1px solid #a2a9b1; padding-bottom: 5px; margin-bottom: 15px; }
    .article .meta { font-size: 0.85rem; color: #54595d; margin-bottom: 20px; font-style: italic; }
    .article-content { font-size: 1rem; line-height: 1.8; white-space: pre-wrap; margin-bottom: 30px; }
    
    /* 編輯區塊 */
    .editor { border: 1px solid #a2a9b1; background: #f8f9fa; padding: 20px; border-radius: 2px; margin-top: 20px; }
    .editor input, .editor select, .editor textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #a2a9b1; font-family: inherit; font-size: 1rem; }
    .editor textarea { min-height: 300px; line-height: 1.6; resize: vertical; }
    .btn-group { display: flex; gap: 10px; }
    .btn-primary { background: #3366cc; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 2px; }
    .btn-secondary { background: #fff; color: #333; border: 1px solid #a2a9b1; padding: 10px 20px; cursor: pointer; border-radius: 2px; }
    .btn-danger { background: #d33; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 2px; }
    
    .welcome-screen { text-align: center; margin-top: 100px; color: #54595d; }
    .welcome-screen h1 { font-family: "Times New Roman", serif; font-size: 2.5rem; margin-bottom: 10px; font-weight: normal; }
  </style>
</head>
<body>

  <!-- 登入畫面 -->
  <div id="authView" class="auth-view hidden">
    <div class="auth-card">
      <h1>我的百科</h1>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="密碼">
      <button id="loginBtn">登入</button>
      <button id="signupBtn" class="ghost">註冊</button>
      <p id="authMsg" class="msg"></p>
    </div>
  </div>

  <!-- 主程式 -->
  <div id="mainView" class="hidden" style="display: flex; width: 100%; height: 100%;">
    <!-- 左側目錄 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>目錄</h2>
        <button id="newEntryBtn" class="btn-primary" style="padding: 5px 10px; font-size: 0.8rem;">+ 新增</button>
      </div>
      <div class="sidebar-search">
        <input type="text" id="searchInput" placeholder="搜尋條目...">
      </div>
      <div class="nav-list" id="navList"></div>
      <div style="padding: 15px; border-top: 1px solid #a2a9b1;">
        <button id="logoutBtn" class="btn-secondary" style="width: 100%;">登出</button>
      </div>
    </div>

    <!-- 右側內容 -->
    <div class="main-content" id="mainContent">
      <!-- 預設畫面 -->
      <div id="welcomeScreen" class="welcome-screen">
        <h1>我的百科全書</h1>
        <p>請從左側目錄選擇一個條目，或點擊「新增」來建立知識庫。</p>
      </div>

      <!-- 閱讀模式 -->
      <div id="viewer" class="article hidden">
        <h1 id="viewTitle"></h1>
        <div class="meta">分類：<span id="viewCategory"></span> ｜ 最後更新：<span id="viewDate"></span></div>
        <div class="article-content" id="viewContent"></div>
        <div class="btn-group">
          <button id="editBtn" class="btn-primary">編輯此條目</button>
          <button id="deleteBtn" class="btn-danger">刪除</button>
        </div>
      </div>

      <!-- 編輯模式 -->
      <div id="editor" class="article hidden">
        <h1 id="editorTitle">建立新條目</h1>
        <div class="editor">
          <input type="text" id="editTitle" placeholder="條目名稱 (標題)">
          <select id="editCategory">
            <option value="人物">人物</option>
            <option value="歷史">歷史</option>
            <option value="科技">科技</option>
            <option value="地理">地理</option>
            <option value="文化">文化</option>
            <option value="其他">其他</option>
          </select>
          <textarea id="editContent" placeholder="在這裡輸入百科內容，支援換行..."></textarea>
          <div class="btn-group">
            <button id="saveBtn" class="btn-primary">儲存條目</button>
            <button id="cancelBtn" class="btn-secondary">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vshfxcygviqsxxnanxzd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KMI9aX76T4fxrrwOCoErlA_7ybOkPq0'; 

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    // DOM
    const authView = document.getElementById('authView');
    const mainView = document.getElementById('mainView');
    const navList = document.getElementById('navList');
    const viewer = document.getElementById('viewer');
    const editor = document.getElementById('editor');
    const welcomeScreen = document.getElementById('welcomeScreen');

    let records = [];
    let currentId = null; // 目前正在看的條目 ID
    let keyword = '';

    // 畫面切換
    function showAuth() { authView.classList.remove('hidden'); mainView.classList.add('hidden'); }
    function showMain() { authView.classList.add('hidden'); mainView.classList.remove('hidden'); }

    // 登入/註冊/登出
    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('authMsg').textContent = error.message;
      else { showMain(); loadRecords(); }
    };
    document.getElementById('signupBtn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await db.auth.signUp({ email, password });
      if (error) document.getElementById('authMsg').textContent = error.message;
      else document.getElementById('authMsg').textContent = '註冊成功，請登入。';
    };
    document.getElementById('logoutBtn').onclick = async () => { await db.auth.signOut(); showAuth(); };

    // 資料庫
    async function loadRecords() {
      const { data, error } = await db.from('records').select('*').order('created_at', { ascending: false });
      if (!error) { records = data; renderNav(); }
    }

    // 渲染左側目錄
    function renderNav() {
      navList.innerHTML = '';
      const filtered = records.filter(r => r.title.toLowerCase().includes(keyword.toLowerCase()));
      
      if (filtered.length === 0) {
        navList.innerHTML = '<div style="padding: 10px; color: #666; font-size: 0.9rem;">沒有符合的條目</div>';
        return;
      }

      filtered.forEach(r => {
        const div = document.createElement('div');
        div.className = 'nav-item';
        div.textContent = r.title;
        div.onclick = () => viewRecord(r.id);
        navList.appendChild(div);
      });
    }

    // 查看條目
    function viewRecord(id) {
      const r = records.find(x => x.id === id);
      if (!r) return;
      currentId = id;
      
      document.getElementById('viewTitle').textContent = r.title;
      document.getElementById('viewCategory').textContent = r.category;
      document.getElementById('viewDate').textContent = new Date(r.created_at).toLocaleString('zh-TW');
      document.getElementById('viewContent').textContent = r.content;

      welcomeScreen.classList.add('hidden');
      editor.classList.add('hidden');
      viewer.classList.remove('hidden');
    }

    // 點擊「新增」按鈕
    document.getElementById('newEntryBtn').onclick = () => {
      currentId = null;
      document.getElementById('editorTitle').textContent = '建立新條目';
      document.getElementById('editTitle').value = '';
      document.getElementById('editCategory').value = '其他';
      document.getElementById('editContent').value = '';
      
      welcomeScreen.classList.add('hidden');
      viewer.classList.add('hidden');
      editor.classList.remove('hidden');
    };

    // 點擊「編輯」按鈕
    document.getElementById('editBtn').onclick = () => {
      const r = records.find(x => x.id === currentId);
      if (!r) return;
      document.getElementById('editorTitle').textContent = '編輯條目：' + r.title;
      document.getElementById('editTitle').value = r.title;
      document.getElementById('editCategory').value = r.category;
      document.getElementById('editContent').value = r.content;

      viewer.classList.add('hidden');
      editor.classList.remove('hidden');
    };

    // 取消編輯
    document.getElementById('cancelBtn').onclick = () => {
      if (currentId) viewRecord(currentId);
      else { welcomeScreen.classList.remove('hidden'); editor.classList.add('hidden'); }
    };

    // 儲存條目 (新增或更新)
    document.getElementById('saveBtn').onclick = async () => {
      const title = document.getElementById('editTitle').value.trim();
      const category = document.getElementById('editCategory').value;
      const content = document.getElementById('editContent').value.trim();
      if (!title || !content) { alert('請填寫標題與內容'); return; }

      if (currentId) {
        // 更新
        const { error } = await db.from('records').update({ title, category, content }).eq('id', currentId);
        if (error) { alert('更新失敗：' + error.message); return; }
        const idx = records.findIndex(x => x.id === currentId);
        records[idx] = { ...records[idx], title, category, content };
      } else {
        // 新增
        const { data: { user } } = await db.auth.getUser();
        const { data, error } = await db.from('records').insert({ user_id: user.id, title, category, content }).select().single();
        if (error) { alert('新增失敗：' + error.message); return; }
        records.unshift(data);
        currentId = data.id;
      }
      
      renderNav();
      viewRecord(currentId);
    };

    // 刪除
    document.getElementById('deleteBtn').onclick = async () => {
      if (!confirm('確定要刪除這個條目嗎？')) return;
      const { error } = await db.from('records').delete().eq('id', currentId);
      if (error) { alert('刪除失敗：' + error.message); return; }
      
      records = records.filter(x => x.id !== currentId);
      currentId = null;
      renderNav();
      viewer.classList.add('hidden');
      welcomeScreen.classList.remove('hidden');
    };

    // 搜尋
    document.getElementById('searchInput').addEventListener('input', e => {
      keyword = e.target.value;
      renderNav();
    });

    // 啟動
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) { showMain(); loadRecords(); }
      else showAuth();
    })();
  </script>
</body>
</html>
